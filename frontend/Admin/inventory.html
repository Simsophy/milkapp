<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Milk App – Inventory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --cream:#fdf6ec;
  --ivory:#fff9f2;
  --milk-white:#ffffff;

  --warm-brown:#5c3d2e;
  --caramel:#c8832a;
  --caramel-light:#f0c27f;
  --caramel-bg:#fef3e2;

  --sage:#7a9e7e;
  --sage-bg:#eaf3eb;

  --rose:#c0736a;
  --rose-bg:#fbeae8;

  --sky:#6a8fc0;
  --sky-bg:#e8eef8;

  --text-dark:#2b1d0e;
  --text-mid:#6b4c38;
  --text-light:#a68970;

  --border:#e8d5c0;
  --nav-h:64px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--cream);
  color:var(--text-dark);
}

/* NAVBAR */

.topnav{
  position:sticky;
  top:0;
  z-index:200;

  height:var(--nav-h);

  background:var(--milk-white);

  border-bottom:1.5px solid var(--border);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 2rem;

  box-shadow:0 2px 12px rgba(92,61,46,0.07);
}

.brand{
  font-size:1.45rem;
  font-weight:700;
  color:var(--warm-brown);
  text-decoration:none;
}

.brand em{
  color:var(--caramel);
  font-style:normal;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:0.4rem;
  flex-wrap:wrap;
}

.nav-links a{
  text-decoration:none;
  font-size:0.875rem;
  font-weight:500;

  color:var(--text-mid);

  padding:0.45rem 0.9rem;

  border-radius:8px;

  transition:0.2s;
}

.nav-links a:hover{
  background:var(--cream);
  color:var(--warm-brown);
}

.nav-links a.active{
  background:var(--caramel);
  color:#fff;
}

.nav-links a.nav-new{
  background:var(--caramel);
  color:#fff;
}

.nav-links a.nav-new:hover{
  background:var(--warm-brown);
}

.nav-links a.nav-logout{
  color:var(--rose);
  border:1.5px solid var(--border);
}

.nav-links a.nav-logout:hover{
  background:var(--rose-bg);
  border-color:var(--rose);
}

.nav-divider{
  width:1px;
  height:20px;
  background:var(--border);
}

.lang-switch{
  display:flex;
  gap:0.3rem;
}

.lang-btn{
  border:1.5px solid var(--border);
  background:#fff;
  color:var(--text-mid);

  border-radius:8px;

  padding:0.25rem 0.5rem;

  font-size:0.72rem;
  font-weight:700;

  cursor:pointer;
}

.lang-btn.active{
  background:var(--caramel);
  border-color:var(--caramel);
  color:#fff;
}

/* PAGE */

.page{
  max-width:1200px;
  margin:0 auto;
  padding:2rem;
}

.page-title{
  font-size:2rem;
  font-weight:700;
  color:var(--warm-brown);

  margin-bottom:0.3rem;
}

.page-sub{
  color:var(--text-light);
  margin-bottom:2rem;
}

/* STATS */

.inv-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1rem;
  margin-bottom:1.5rem;
}

.inv-stat{
  background:#fff;
  border-radius:14px;
  border:1.5px solid var(--border);

  padding:1rem 1.2rem;

  display:flex;
  align-items:center;
  gap:0.8rem;
}

.is-icon{
  width:40px;
  height:40px;

  border-radius:10px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:1.2rem;
}

.is-label{
  font-size:0.75rem;
  text-transform:uppercase;
  color:var(--text-light);
  font-weight:600;
}

.is-value{
  font-size:1.3rem;
  font-weight:700;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;

  margin-bottom:1.5rem;
}

.search-box{
  flex:1;
  min-width:220px;
  position:relative;
}

.search-box::before{
  content:'🔍';

  position:absolute;
  left:0.8rem;
  top:50%;

  transform:translateY(-50%);
}

.search-box input{
  width:100%;

  padding:0.65rem 1rem 0.65rem 2.4rem;

  border-radius:10px;
  border:1.5px solid var(--border);

  background:#fff;

  outline:none;
}

.search-box input:focus{
  border-color:var(--caramel);
}

.filter-select{
  padding:0.65rem 1rem;

  border-radius:10px;
  border:1.5px solid var(--border);

  background:#fff;

  cursor:pointer;
}

.btn-add{
  padding:0.65rem 1.2rem;

  border:none;
  border-radius:10px;

  background:var(--caramel);
  color:#fff;

  font-weight:600;

  cursor:pointer;

  transition:0.2s;
}

.btn-add:hover{
  background:var(--warm-brown);
}

/* ADD FORM */

.add-product-form{
  display:none;

  margin-bottom:1.5rem;

  background:#fff;

  border:1.5px solid var(--border);

  border-radius:14px;

  padding:1rem;
}

.form-grid{
  display:flex;
  flex-wrap:wrap;
  gap:1rem;
}

.form-group{
  flex:1;
  min-width:180px;

  display:flex;
  flex-direction:column;
  gap:0.4rem;
}

.form-group label{
  font-size:0.85rem;
  font-weight:600;
}

.form-group input{
  padding:0.6rem 0.8rem;

  border-radius:8px;
  border:1.5px solid var(--border);

  outline:none;
}

.form-group input:focus{
  border-color:var(--caramel);
}

.form-actions{
  display:flex;
  gap:0.6rem;
  margin-top:1rem;
}

.btn-secondary{
  background:#d8d8d8;
  color:#333;
}

/* TABLE */

.table-card{
  background:#fff;

  border-radius:16px;

  overflow:hidden;

  border:1.5px solid var(--border);
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:var(--ivory);
}

thead th{
  padding:1rem 1.2rem;

  font-size:0.75rem;
  text-transform:uppercase;

  color:var(--text-light);

  text-align:left;

  border-bottom:1px solid var(--border);
}

tbody tr{
  border-bottom:1px solid var(--border);
}

tbody tr:hover{
  background:var(--cream);
}

tbody td{
  padding:1rem 1.2rem;
}

.prod-cell{
  display:flex;
  align-items:center;
  gap:0.7rem;
}

.prod-emoji{
  font-size:1.5rem;
}

.prod-name{
  font-weight:600;
}

.stock-bar{
  width:90px;
  height:6px;

  background:var(--border);

  border-radius:999px;

  overflow:hidden;

  margin-top:5px;
}

.stock-fill{
  height:100%;
}

.badge{
  display:inline-block;

  padding:4px 10px;

  border-radius:999px;

  font-size:0.72rem;
  font-weight:700;
}

.badge.in{
  background:var(--sage-bg);
  color:var(--sage);
}

.badge.low{
  background:var(--caramel-bg);
  color:var(--caramel);
}

.badge.out{
  background:var(--rose-bg);
  color:var(--rose);
}

.action-btns{
  display:flex;
  gap:0.5rem;
}

.act-btn{
  padding:0.4rem 0.7rem;

  border-radius:8px;
  border:1px solid var(--border);

  background:#fff;

  cursor:pointer;

  transition:0.2s;
}

.act-btn:hover{
  border-color:var(--caramel);
  background:var(--caramel-bg);
  color:var(--caramel);
}

.act-btn.danger:hover{
  border-color:var(--rose);
  background:var(--rose-bg);
  color:var(--rose);
}

.empty-state{
  text-align:center;
  padding:2rem;
  color:var(--text-light);
}

/* RESPONSIVE */

@media(max-width:900px){

  .inv-stats{
    grid-template-columns:repeat(2,1fr);
  }

  .topnav{
    padding:1rem;
    height:auto;
    flex-direction:column;
    align-items:flex-start;
    gap:1rem;
  }

  .page{
    padding:1rem;
  }

  .table-card{
    overflow-x:auto;
  }
}

@media(max-width:600px){

  .inv-stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<nav class="topnav">
  <a class="brand" href="/admin">Milk <em>App</em></a>

  <div class="nav-links">
    <a href="/admin">📊 Dashboard</a>
    <a href="/admin/inventory" class="active">📦 Inventory</a>
    <a href="/user" class="nav-new">＋ New Order</a>
    <a href="/admin/delivery">🚚 Delivery</a>

    <div class="lang-switch">
      <button class="lang-btn active">EN</button>
      <button class="lang-btn">KH</button>
    </div>

    <div class="nav-divider"></div>

    <a href="/login" class="nav-logout">⏻ Logout</a>
  </div>
</nav>

<div class="page">

  <h1 class="page-title">Inventory</h1>
  <p class="page-sub">Manage your milk product stock levels.</p>

  <!-- STATS -->

  <div class="inv-stats">

    <div class="inv-stat">
      <div class="is-icon" style="background:var(--sage-bg)">📦</div>
      <div>
        <div class="is-label">Total Products</div>
        <div class="is-value" id="statTotal">0</div>
      </div>
    </div>

    <div class="inv-stat">
      <div class="is-icon" style="background:var(--caramel-bg)">⚠️</div>
      <div>
        <div class="is-label">Low Stock</div>
        <div class="is-value" id="statLow">0</div>
      </div>
    </div>

    <div class="inv-stat">
      <div class="is-icon" style="background:var(--rose-bg)">❌</div>
      <div>
        <div class="is-label">Out of Stock</div>
        <div class="is-value" id="statOut">0</div>
      </div>
    </div>

    <div class="inv-stat">
      <div class="is-icon" style="background:var(--sky-bg)">✅</div>
      <div>
        <div class="is-label">In Stock</div>
        <div class="is-value" id="statIn">0</div>
      </div>
    </div>

  </div>

  <!-- TOOLBAR -->

  <div class="toolbar">

    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
      >
    </div>

    <select class="filter-select" id="catFilter">
      <option value="">All Categories</option>
      <option value="fresh">Fresh Milk</option>
      <option value="flavored">Flavored</option>
      <option value="yogurt">Yogurt</option>
      <option value="cheese">Cheese</option>
      <option value="butter">Butter & Cream</option>
    </select>

    <select class="filter-select" id="stockFilter">
      <option value="">All Stock</option>
      <option value="in">In Stock</option>
      <option value="low">Low Stock</option>
      <option value="out">Out of Stock</option>
    </select>

    <button class="btn-add" id="toggleFormBtn">
      ＋ Add Product
    </button>

  </div>

  <!-- ADD FORM -->

  <div class="add-product-form" id="addProductForm">

    <div class="form-grid">

      <div class="form-group">
        <label>Product Name</label>
        <input type="text" id="newName" placeholder="Strawberry Milk">
      </div>

      <div class="form-group">
        <label>Price</label>
        <input type="number" id="newPrice" placeholder="2.50">
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="newStock" placeholder="100">
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" id="newCategory" placeholder="fresh">
      </div>

    </div>

    <div class="form-actions">
      <button class="btn-add" id="saveBtn">💾 Save Product</button>

      <button class="btn-add btn-secondary" id="cancelBtn">
        ✕ Cancel
      </button>
    </div>

  </div>

  <!-- TABLE -->

  <div class="table-card">

    <table>

      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Price</th>
          <th>Stock</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="invBody"></tbody>

    </table>

  </div>

</div>

<script>

const API_BASE = '/routes/api.php';

let products = [];
let editingId = null;

const defaultProducts = [
  {
    id:1,
    name:'Full Cream Milk',
    emoji:'🥛',
    cat:'fresh',
    price:2.50,
    stock:120,
    max:200
  },
  {
    id:2,
    name:'Chocolate Milk',
    emoji:'🍫',
    cat:'flavored',
    price:3.20,
    stock:18,
    max:100
  },
  {
    id:3,
    name:'Greek Yogurt',
    emoji:'🥣',
    cat:'yogurt',
    price:4.50,
    stock:0,
    max:80
  }
];

function saveProducts(){
  localStorage.setItem('milkProducts', JSON.stringify(products));
}

function loadProducts(){
  const local = localStorage.getItem('milkProducts');

  if(local){
    products = JSON.parse(local);
  }else{
    products = defaultProducts;
    saveProducts();
  }

  renderTable();
  updateStats();
}

function getStatus(product){

  if(product.stock <= 0){
    return 'out';
  }

  if(product.stock <= 20){
    return 'low';
  }

  return 'in';
}

function updateStats(){

  document.getElementById('statTotal').textContent = products.length;

  document.getElementById('statLow').textContent =
    products.filter(p => getStatus(p) === 'low').length;

  document.getElementById('statOut').textContent =
    products.filter(p => getStatus(p) === 'out').length;

  document.getElementById('statIn').textContent =
    products.filter(p => getStatus(p) === 'in').length;
}

function renderTable(){

  const q = document
    .getElementById('searchInput')
    .value
    .toLowerCase();

  const category =
    document.getElementById('catFilter').value;

  const stock =
    document.getElementById('stockFilter').value;

  const tbody = document.getElementById('invBody');

  let filtered = products.filter(product => {

    if(
      q &&
      !product.name.toLowerCase().includes(q)
    ){
      return false;
    }

    if(
      category &&
      product.cat !== category
    ){
      return false;
    }

    if(
      stock &&
      getStatus(product) !== stock
    ){
      return false;
    }

    return true;
  });

  if(filtered.length === 0){

    tbody.innerHTML = `
      <tr>
        <td colspan="6">
          <div class="empty-state">
            No products found.
          </div>
        </td>
      </tr>
    `;

    return;
  }

  tbody.innerHTML = filtered.map(product => {

    const status = getStatus(product);

    const percent = Math.min(
      (product.stock / product.max) * 100,
      100
    );

    const barColor = {
      in:'var(--sage)',
      low:'var(--caramel)',
      out:'var(--rose)'
    }[status];

    return `
      <tr>

        <td>
          <div class="prod-cell">

            <div class="prod-emoji">
              ${product.emoji}
            </div>

            <div class="prod-name">
              ${product.name}
            </div>

          </div>
        </td>

        <td>${product.cat}</td>

        <td style="font-weight:700;color:var(--caramel)">
          $${product.price.toFixed(2)}
        </td>

        <td>
          <div>
            ${product.stock} / ${product.max}
          </div>

          <div class="stock-bar">
            <div
              class="stock-fill"
              style="
                width:${percent}%;
                background:${barColor};
              "
            ></div>
          </div>
        </td>

        <td>
          <span class="badge ${status}">
            ${status.toUpperCase()}
          </span>
        </td>

        <td>

          <div class="action-btns">

            <button
              class="act-btn"
              onclick="restock(${product.id})"
            >
              Restock
            </button>

            <button
              class="act-btn"
              onclick="editProduct(${product.id})"
            >
              Edit
            </button>

            <button
              class="act-btn danger"
              onclick="removeProduct(${product.id})"
            >
              Remove
            </button>

          </div>

        </td>

      </tr>
    `;
  }).join('');
}

function toggleForm(show){

  const form =
    document.getElementById('addProductForm');

  form.style.display = show ? 'block' : 'none';
}

function clearForm(){

  document.getElementById('newName').value = '';
  document.getElementById('newPrice').value = '';
  document.getElementById('newStock').value = '';
  document.getElementById('newCategory').value = '';

  editingId = null;
}

function addProduct(){

  const name =
    document.getElementById('newName').value.trim();

  const price =
    parseFloat(
      document.getElementById('newPrice').value
    );

  const stock =
    parseInt(
      document.getElementById('newStock').value
    );

  const category =
    document.getElementById('newCategory').value.trim();

  if(
    !name ||
    isNaN(price) ||
    isNaN(stock) ||
    !category
  ){
    alert('Please fill all fields.');
    return;
  }

  if(editingId){

    const product =
      products.find(p => p.id === editingId);

    product.name = name;
    product.price = price;
    product.stock = stock;
    product.cat = category;

  }else{

    products.push({
      id:Date.now(),
      name,
      emoji:'🥛',
      cat:category,
      price,
      stock,
      max:Math.max(stock * 2, 100)
    });
  }

  saveProducts();

  renderTable();
  updateStats();

  clearForm();

  toggleForm(false);
}

function editProduct(id){

  const product =
    products.find(p => p.id === id);

  if(!product){
    return;
  }

  editingId = id;

  document.getElementById('newName').value =
    product.name;

  document.getElementById('newPrice').value =
    product.price;

  document.getElementById('newStock').value =
    product.stock;

  document.getElementById('newCategory').value =
    product.cat;

  toggleForm(true);
}

function removeProduct(id){

  const confirmDelete =
    confirm('Remove this product?');

  if(!confirmDelete){
    return;
  }

  products =
    products.filter(p => p.id !== id);

  saveProducts();

  renderTable();
  updateStats();
}

function restock(id){

  const product =
    products.find(p => p.id === id);

  if(!product){
    return;
  }

  const amount =
    parseInt(
      prompt(`Add stock for ${product.name}`)
    );

  if(isNaN(amount) || amount <= 0){
    return;
  }

  product.stock += amount;

  saveProducts();

  renderTable();
  updateStats();
}

/* EVENTS */

document
  .getElementById('searchInput')
  .addEventListener('input', renderTable);

document
  .getElementById('catFilter')
  .addEventListener('change', renderTable);

document
  .getElementById('stockFilter')
  .addEventListener('change', renderTable);

document
  .getElementById('toggleFormBtn')
  .addEventListener('click', () => {
    toggleForm(true);
  });

document
  .getElementById('cancelBtn')
  .addEventListener('click', () => {

    clearForm();

    toggleForm(false);
  });

document
  .getElementById('saveBtn')
  .addEventListener('click', addProduct);

/* INIT */

loadProducts();

</script>

</body>
</html>
