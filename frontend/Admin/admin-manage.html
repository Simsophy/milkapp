<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Manage Users & Products</title>

    <link rel="stylesheet" href="/assets/bootstrap.min.css">

    <style>
        :root {
            --primary: #c8832a;
            --dark: #2b1d0e;
            --light: #fdf6ec;
        }

        body {
            background: var(--light);
            font-family: 'DM Sans', sans-serif;
            color: var(--dark);
        }

        .layout-row {
            min-height: 100vh;
        }

        .brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--dark);
        }

        .brand span {
            color: var(--primary);
        }

        .logout-link {
            color: #c0736a !important;
        }

        .tab-hidden {
            display: none;
        }

        .sidebar {
            background: white;
            border-right: 2px solid #e8d5c0;
            min-height: 100vh;
        }

        .sidebar .nav-link {
            color: var(--dark);
            padding: 12px 20px;
            margin: 5px 0;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: 1px solid #e8d5c0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: #b0722a;
            border-color: #b0722a;
        }

        .table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        .table th {
            background: #f5ede2;
            border-bottom: 2px solid #e8d5c0;
            font-weight: 600;
            color: var(--dark);
        }

        .badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-customer {
            background: #e8eef8;
            color: #6a8fc0;
        }

        .badge-seller {
            background: #eaf3eb;
            color: #7a9e7e;
        }

        .badge-admin {
            background: #fbeae8;
            color: #c0736a;
        }

        .form-control,
        .form-select {
            border: 1px solid #e8d5c0;
            border-radius: 8px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(200, 131, 42, 0.25);
        }

        .modal-header {
            background: var(--light);
            border-bottom: 1px solid #e8d5c0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .error {
            display: none;
            padding: 12px;
            background: #fbeae8;
            border: 1px solid #c0736a;
            border-radius: 8px;
            color: #c0736a;
            margin-bottom: 15px;
        }

        .error.active {
            display: block;
        }

        .success {
            display: none;
            padding: 12px;
            background: #eaf3eb;
            border: 1px solid #7a9e7e;
            border-radius: 8px;
            color: #7a9e7e;
            margin-bottom: 15px;
        }

        .success.active {
            display: block;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row layout-row">

        <!-- Sidebar -->
        <aside class="col-md-2 sidebar p-3">

            <div class="brand mb-4">
                Milk <span>Admin</span>
            </div>

            <nav class="nav flex-column">

                <a
                    class="nav-link active"
                    href="#"
                    data-tab="users"
                    onclick="showTab(event, 'users')"
                    aria-label="Manage Users"
                >
                    👥 Manage Users
                </a>

                <a
                    class="nav-link"
                    href="#"
                    data-tab="products"
                    onclick="showTab(event, 'products')"
                    aria-label="Manage Products"
                >
                    📦 Manage Products
                </a>

                <a
                    class="nav-link"
                    href="/admin"
                    aria-label="Dashboard"
                >
                    📊 Dashboard
                </a>

                <a
                    class="nav-link logout-link"
                    href="/routes/api.php?action=logout"
                    aria-label="Logout"
                >
                    ⏻ Logout
                </a>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="col-md-10 content">

            <!-- Users Tab -->
            <section id="usersTab" class="tab-content">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2>Manage Users</h2>

                    <button
                        class="btn btn-primary"
                        type="button"
                        onclick="showModal('addUserModal')"
                        aria-label="Add User"
                    >
                        + Add User
                    </button>
                </div>

                <div id="usersError" class="error"></div>
                <div id="usersSuccess" class="success"></div>

                <div id="usersLoading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading users...</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table" id="usersTable">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody></tbody>

                    </table>
                </div>

            </section>

            <!-- Products Tab -->
            <section id="productsTab" class="tab-content tab-hidden">

                <div class="d-flex justify-content-between align-items-center mb-4">

                    <h2>Manage Products</h2>

                    <button
                        class="btn btn-primary"
                        type="button"
                        onclick="showModal('addProductModal')"
                        aria-label="Add Product"
                    >
                        + Add Product
                    </button>

                </div>

                <div id="productsError" class="error"></div>
                <div id="productsSuccess" class="success"></div>

                <div id="productsLoading" class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading products...</span>
                    </div>
                </div>

                <div class="table-responsive">

                    <table class="table" id="productsTable">

                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                        </thead>

                        <tbody></tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>
</div>

<!-- Add User Modal -->
<div
    class="modal fade"
    id="addUserModal"
    tabindex="-1"
    aria-labelledby="addUserModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="addUserModalLabel">
                    Add New User
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>

            <form id="addUserForm">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label" for="newUsername">
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="newUsername"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="newEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="newEmail"
                            placeholder="Enter email"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="newPhone">
                            Phone
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="newPhone"
                            placeholder="Enter phone number"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="newRole">
                            Role
                        </label>

                        <select
                            class="form-select"
                            id="newRole"
                            aria-label="Select user role"
                        >
                            <option value="customer">Customer</option>
                            <option value="seller">Seller</option>
                            <option value="admin">Admin</option>
                        </select>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add User
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<!-- Add Product Modal -->
<div
    class="modal fade"
    id="addProductModal"
    tabindex="-1"
    aria-labelledby="addProductModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="addProductModalLabel">
                    Add New Product
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>

            <form id="addProductForm">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label" for="productName">
                            Product Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="productName"
                            placeholder="Enter product name"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="productDescription">
                            Description
                        </label>

                        <textarea
                            class="form-control"
                            id="productDescription"
                            rows="3"
                            placeholder="Enter product description"
                        ></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="productCategory">
                            Category
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="productCategory"
                            placeholder="e.g., Fresh Milk"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="productPrice">
                            Price
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="productPrice"
                            step="0.01"
                            placeholder="Enter product price"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="productStock">
                            Stock
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="productStock"
                            value="0"
                            placeholder="Enter stock quantity"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label" for="productImageUrl">
                            Image URL
                        </label>

                        <input
                            type="url"
                            class="form-control"
                            id="productImageUrl"
                            placeholder="Enter image URL"
                        >

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Add Product
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<!-- Edit Role Modal -->
<div
    class="modal fade"
    id="editRoleModal"
    tabindex="-1"
    aria-labelledby="editRoleModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title" id="editRoleModalLabel">
                    Change User Role
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>

            <form id="editRoleForm">

                <div class="modal-body">

                    <div class="mb-3">

                        <label class="form-label" for="editRole">
                            New Role
                        </label>

                        <select
                            class="form-select"
                            id="editRole"
                            aria-label="Edit user role"
                        >
                            <option value="customer">Customer</option>
                            <option value="seller">Seller</option>
                            <option value="admin">Admin</option>
                        </select>

                    </div>

                </div>

                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Update Role
                    </button>

                </div>

            </form>

        </div>
    </div>
</div>

<script src="/assets/bootstrap.bundle.min.js"></script>
<script src="/js/roleControl.js"></script>

<script>
    let currentEditUserId = null;
    const API_BASE = '/routes/api.php';

    // Tab switching
    function showTab(event, tabName) {

        document.querySelectorAll('.tab-content').forEach(el => {
            el.classList.add('tab-hidden');
        });

        document.getElementById(tabName + 'Tab')
            .classList.remove('tab-hidden');

        document.querySelectorAll('.nav-link').forEach(el => {
            el.classList.remove('active');
        });

        event.currentTarget.classList.add('active');

        if (tabName === 'users') loadUsers();
        if (tabName === 'products') loadProducts();
    }

    // Modal helpers
    function showModal(modalId) {
        new bootstrap.Modal(
            document.getElementById(modalId)
        ).show();
    }

    function hideModal(modalId) {
        bootstrap.Modal
            .getInstance(document.getElementById(modalId))
            ?.hide();
    }

    // Load users
    async function loadUsers() {

        const loading = document.getElementById('usersLoading');
        const error = document.getElementById('usersError');
        const tbody = document.querySelector('#usersTable tbody');

        loading.classList.add('active');
        error.classList.remove('active');

        tbody.innerHTML = '';

        try {

            const res = await fetch(
                `${API_BASE}?action=users`,
                {
                    credentials: 'include'
                }
            );

            const data = await res.json();

            if (!data.success) {
                throw new Error(data.message || 'Failed to load users');
            }

            data.users.forEach(user => {

                const row = `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td>${user.email || '-'}</td>
                        <td>${user.phone || '-'}</td>

                        <td>
                            <span class="badge badge-${user.role}">
                                ${user.role}
                            </span>
                        </td>

                        <td>
                            <button
                                class="btn btn-sm btn-outline-primary"
                                type="button"
                                aria-label="Change role for ${user.username}"
                                onclick="editUserRole(${user.id}, '${user.role}')"
                            >
                                Change Role
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            });

        } catch (err) {

            error.textContent = err.message;
            error.classList.add('active');

        } finally {

            loading.classList.remove('active');
        }
    }

    // Edit role
    function editUserRole(userId, currentRole) {

        currentEditUserId = userId;

        document.getElementById('editRole').value = currentRole;

        showModal('editRoleModal');
    }

    // Update role
    document.getElementById('editRoleForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            const newRole =
                document.getElementById('editRole').value;

            try {

                const res = await fetch(
                    `${API_BASE}?action=update-user-role`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            user_id: currentEditUserId,
                            role: newRole
                        })
                    }
                );

                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message);
                }

                hideModal('editRoleModal');

                showMessage(
                    'usersSuccess',
                    'User role updated successfully!'
                );

                loadUsers();

            } catch (err) {

                showMessage(
                    'usersError',
                    err.message
                );
            }
        });

    // Load products
    async function loadProducts() {

        const loading =
            document.getElementById('productsLoading');

        const error =
            document.getElementById('productsError');

        const tbody =
            document.querySelector('#productsTable tbody');

        loading.classList.add('active');

        error.classList.remove('active');

        tbody.innerHTML = '';

        try {

            const res = await fetch(
                `${API_BASE}?action=products`,
                {
                    credentials: 'include'
                }
            );

            const data = await res.json();

            if (!data.success) {
                throw new Error(
                    data.message || 'Failed to load products'
                );
            }

            data.products.forEach(product => {

                const row = `
                    <tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.category || '-'}</td>
                        <td>$${parseFloat(product.price).toFixed(2)}</td>
                        <td>${product.stock}</td>

                        <td>
                            <button
                                class="btn btn-sm btn-outline-danger"
                                type="button"
                                aria-label="Delete ${product.name}"
                                onclick="deleteProduct(${product.id})"
                            >
                                Delete
                            </button>
                        </td>
                    </tr>
                `;

                tbody.innerHTML += row;
            });

        } catch (err) {

            error.textContent = err.message;
            error.classList.add('active');

        } finally {

            loading.classList.remove('active');
        }
    }

    // Add product
    document.getElementById('addProductForm')
        .addEventListener('submit', async (e) => {

            e.preventDefault();

            try {

                const res = await fetch(
                    `${API_BASE}?action=products`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify({
                            name: document.getElementById('productName').value,
                            description: document.getElementById('productDescription').value,
                            category: document.getElementById('productCategory').value,
                            price: parseFloat(document.getElementById('productPrice').value),
                            stock: parseInt(document.getElementById('productStock').value),
                            image_url: document.getElementById('productImageUrl').value
                        })
                    }
                );

                const data = await res.json();

                if (!data.success) {
                    throw new Error(data.message);
                }

                hideModal('addProductModal');

                document.getElementById('addProductForm').reset();

                showMessage(
                    'productsSuccess',
                    'Product added successfully!'
                );

                loadProducts();

            } catch (err) {

                showMessage(
                    'productsError',
                    err.message
                );
            }
        });

    // Delete product
    async function deleteProduct(productId) {

        const confirmed = confirm(
            'Are you sure you want to delete this product?'
        );

        if (!confirmed) return;

        try {

            const res = await fetch(
                `${API_BASE}?action=product&id=${productId}`,
                {
                    method: 'DELETE',
                    credentials: 'include'
                }
            );

            const data = await res.json();

            if (!data.success) {
                throw new Error(data.message);
            }

            showMessage(
                'productsSuccess',
                'Product deleted successfully!'
            );

            loadProducts();

        } catch (err) {

            showMessage(
                'productsError',
                err.message
            );
        }
    }

    // Show messages
    function showMessage(elementId, message) {

        const el = document.getElementById(elementId);

        el.textContent = message;

        el.classList.add('active');

        setTimeout(() => {
            el.classList.remove('active');
        }, 4000);
    }

    // Initial load
    (async () => {

        const user = await enforceAdminOnly();

        if (user) {
            loadUsers();
        }

    })();
</script>

</body>
</html>
