<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Milk App</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --info: #4895ef;
            --warning: #f72585;
            --danger: #e63946;
            --light: #f8f9fa;
            --dark: #212529;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: var(--dark);
            color: white;
            padding: 20px;
            position: fixed;
        }

        .sidebar h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin-bottom: 10px;
        }

        .nav-links a {
            color: #adb5bd;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: var(--primary);
            color: white;
        }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            gap: 20px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 0.9rem;
            color: #6c757d;
        }

        .stat-info p {
            margin: 5px 0 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--dark);
        }

        .recent-orders {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .recent-orders h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            border-bottom: 2px solid #f0f2f5;
            color: #6c757d;
            font-weight: 600;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #f0f2f5;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-completed { background: #d4edda; color: #155724; }
        .status-delivered { background: #cce5ff; color: #004085; }

        .btn-logout {
            background: var(--danger);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: #bd2130;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-glass-milk"></i> MilkApp</h2>
        <ul class="nav-links">
            <li><a href="/admin/dashboard" class="active"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/admin/manage-product"><i class="fas fa-box"></i> Manage Products</a></li>
            <li><a href="/admin/inventory"><i class="fas fa-warehouse"></i> Inventory</a></li>
            <li><a href="/admin/delivery"><i class="fas fa-truck"></i> Deliveries</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Admin Dashboard</h1>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be loaded here -->
             <div class="stat-card">
                <div class="stat-icon" style="background: #e7f0ff; color: #4361ee;"><i class="fas fa-shopping-cart"></i></div>
                <div class="stat-info"><h3>Total Orders</h3><p id="totalOrders">0</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #e6fffa; color: #38b2ac;"><i class="fas fa-dollar-sign"></i></div>
                <div class="stat-info"><h3>Total Revenue</h3><p id="totalRevenue">$0.00</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fff5f5; color: #f56565;"><i class="fas fa-box"></i></div>
                <div class="stat-info"><h3>Total Products</h3><p id="totalProducts">0</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #fffaf0; color: #ed8936;"><i class="fas fa-exclamation-triangle"></i></div>
                <div class="stat-info"><h3>Low Stock</h3><p id="lowStockCount">0</p></div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: #f0f5ff; color: #5a67d8;"><i class="fas fa-clock"></i></div>
                <div class="stat-info"><h3>Pending Orders</h3><p id="pendingOrders">0</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #f0fff4; color: #48bb78;"><i class="fas fa-check-circle"></i></div>
                <div class="stat-info"><h3>Completed Orders</h3><p id="completedOrders">0</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: #ebf8ff; color: #4299e1;"><i class="fas fa-truck-loading"></i></div>
                <div class="stat-info"><h3>Total Deliveries</h3><p id="totalDeliveries">0</p></div>
            </div>
        </div>

        <div class="recent-orders">
            <h2>Recent Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="recentOrdersBody">
                    <tr><td colspan="5" style="text-align:center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Removed unused api.js script to avoid SyntaxError -->
    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/routes/api.php?action=dashboard-stats');
                const result = await response.json();

                if (result.success) {
                    const data = result.data;
                    document.getElementById('totalOrders').textContent = data.totalOrders;
                    document.getElementById('totalRevenue').textContent = '$' + data.totalRevenue.toFixed(2);
                    document.getElementById('totalProducts').textContent = data.totalProducts;
                    document.getElementById('lowStockCount').textContent = data.lowStockCount;
                    document.getElementById('pendingOrders').textContent = data.pendingOrders;
                    document.getElementById('completedOrders').textContent = data.completedOrders;
                    document.getElementById('totalDeliveries').textContent = data.totalDeliveries;

                    const recentBody = document.getElementById('recentOrdersBody');
                    recentBody.innerHTML = '';
                    
                    if (data.recentOrders.length === 0) {
                        recentBody.innerHTML = '<tr><td colspan="5" style="text-align:center">No orders found</td></tr>';
                    } else {
                        data.recentOrders.forEach(order => {
                            const date = new Date(order.created_at).toLocaleDateString();
                            recentBody.innerHTML += `
                                <tr>
                                    <td>#${order.id}</td>
                                    <td>${order.customer_name || 'Walk-in'}</td>
                                    <td>$${parseFloat(order.total).toFixed(2)}</td>
                                    <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                                    <td>${date}</td>
                                </tr>
                            `;
                        });
                    }
                }
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function logout() {
            await fetch('/routes/api.php?action=logout');
            window.location.href = '/login.html';
        }

        window.onload = loadDashboard;
    </script>
</body>
</html>
