<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add New Product - Milk App</title>
<style>
  :root {
    --cream: #fdf6ec;
    --ivory: #fff9f2;
    --milk-white: #ffffff;
    --warm-brown: #5c3d2e;
    --caramel: #c8832a;
    --caramel-light: #f0c27f;
    --caramel-bg: #fef3e2;
    --sage: #7a9e7e;
    --sage-bg: #eaf3eb;
    --rose: #c0736a;
    --rose-bg: #fbeae8;
    --sky: #6a8fc0;
    --sky-bg: #e8eef8;
    --text-dark: #2b1d0e;
    --text-mid: #6b4c38;
    --text-light: #a68970;
    --border: #e8d5c0;
    --nav-h: 64px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, var(--cream) 0%, var(--ivory) 100%);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 2rem;
  }

  /* Navigation */
  nav.topnav {
    position: sticky;
    top: 0;
    z-index: 200;
    height: var(--nav-h);
    background: var(--milk-white);
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    box-shadow: 0 2px 12px rgba(92, 61, 46, 0.07);
    margin: -2rem -2rem 2rem -2rem;
  }

  .brand {
    font-family: 'Playfair Display', serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--warm-brown);
    text-decoration: none;
  }

  .brand em {
    color: var(--caramel);
    font-style: normal;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .nav-links a {
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--text-mid);
    padding: 0.4rem 0.9rem;
    border-radius: 8px;
    transition: background 0.18s, color 0.18s;
  }

  .nav-links a:hover {
    background: var(--cream);
    color: var(--warm-brown);
  }

  .nav-links a.nav-logout {
    color: var(--rose);
    border: 1.5px solid var(--border);
  }

  .nav-links a.nav-logout:hover {
    background: var(--rose-bg);
    border-color: var(--rose);
  }

  /* Main Container */
  .container {
    max-width: 700px;
    margin: 2rem auto;
    background: var(--milk-white);
    border-radius: 16px;
    border: 1.5px solid var(--border);
    padding: 2.5rem;
    box-shadow: 0 10px 40px rgba(92, 61, 46, 0.1);
  }

  .form-header {
    margin-bottom: 2rem;
  }

  .form-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--warm-brown);
    margin-bottom: 0.5rem;
  }

  .form-header p {
    color: var(--text-light);
    font-size: 0.95rem;
  }

  /* Form Styles */
  .form-group {
    margin-bottom: 1.5rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  .form-row.full {
    grid-template-columns: 1fr;
  }

  label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--text-mid);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  input[type="text"],
  input[type="number"],
  input[type="email"],
  input[type="url"],
  select,
  textarea {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--text-dark);
    background: var(--cream);
    transition: border-color 0.2s, background 0.2s;
    outline: none;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--caramel);
    background: var(--milk-white);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
  }

  /* Button Styles */
  .form-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 2rem;
  }

  button {
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }

  .btn-submit {
    background: var(--caramel);
    color: #fff;
    box-shadow: 0 4px 15px rgba(200, 131, 42, 0.3);
  }

  .btn-submit:hover {
    background: var(--warm-brown);
    box-shadow: 0 6px 20px rgba(92, 61, 46, 0.3);
  }

  .btn-submit:active {
    transform: scale(0.98);
  }

  .btn-cancel {
    background: var(--border);
    color: var(--text-mid);
  }

  .btn-cancel:hover {
    background: var(--text-light);
    color: var(--milk-white);
  }

  /* Alert Messages */
  .alert {
    padding: 1rem;
    border-radius: 10px;
    margin-bottom: 1.5rem;
    display: none;
    font-size: 0.9rem;
  }

  .alert.show {
    display: block;
  }

 .alert.success {
  background: var(--sage-bg);
  color: var(--sage);
  border: 1.5px solid var(--sage);
  font-size: 1rem;
  font-weight: 700;
  padding: 1.2rem;
}
  .alert.error {
    background: var(--rose-bg);
    color: var(--rose);
    border: 1.5px solid var(--rose);
  }

  .alert.info {
    background: var(--sky-bg);
    color: var(--sky);
    border: 1.5px solid var(--sky);
  }

  .alert-icon {
    margin-right: 0.5rem;
  }

  /* Loading State */
  .btn-submit.loading {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .btn-submit.loading::after {
    content: '';
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.6s linear infinite;
    margin-left: auto;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Helper Text */
  .helper-text {
    font-size: 0.8rem;
    color: var(--text-light);
    margin-top: 0.3rem;
  }

  /* Responsive */
  @media (max-width: 768px) {
    body {
      padding: 1rem;
    }

    .container {
      padding: 1.5rem;
    }

    .form-row {
      grid-template-columns: 1fr;
    }

    .form-actions {
      grid-template-columns: 1fr;
    }

    nav.topnav {
      padding: 0 1rem;
      margin: -1rem -1rem 1.5rem -1rem;
    }

    .brand {
      font-size: 1.2rem;
    }
  }
</style>
</head>
<body>

<nav class="topnav">
  <a class="brand" href="/admin">Milk <em>App</em></a>
  <div class="nav-links">
    <a href="/admin">📊 Dashboard</a>
    <a href="/admin/inventory">📦 Inventory</a>
    <a href="/routes/api.php?action=logout" class="nav-logout">⏻ Logout</a>
  </div>
</nav>

<div class="container">
  <div class="form-header">
    <h1>📦 Add New Product</h1>
    <p>Create a new milk product in your inventory</p>
  </div>

  <div id="alertBox" class="alert"></div>

 <form id="productForm" method="POST" action="javascript:void(0);">
    <!-- Product Name -->
    <div class="form-group">
      <label for="productName">Product Name *</label>
      <input
        type="text"
        id="productName"
        name="productName"
        placeholder="e.g. Strawberry Flavored Milk"
        required
      >
      <div class="helper-text">Name of your milk product</div>
    </div>

    <!-- Price and Stock Row -->
    <div class="form-row">
      <div class="form-group">
        <label for="price">Price (USD) *</label>
        <input
          type="number"
          id="price"
          name="price"
          placeholder="2.50"
          min="0"
          step="0.01"
          required
        >
        <div class="helper-text">Price per unit</div>
      </div>

      <div class="form-group">
        <label for="stock">Initial Stock *</label>
        <input
          type="number"
          id="stock"
          name="stock"
          placeholder="100"
          min="0"
          required
        >
        <div class="helper-text">Starting quantity</div>
      </div>
    </div>

    <!-- Category and Description Row -->
    <div class="form-row">
      <div class="form-group">
        <label for="category">Category *</label>
        <select id="category" name="category" required>
          <option value="">Select a category</option>
          <option value="fresh">Fresh Milk</option>
          <option value="flavored">Flavored Milk</option>
          <option value="yogurt">Yogurt</option>
          <option value="cheese">Cheese</option>
          <option value="butter">Butter & Cream</option>
          <option value="other">Other</option>
        </select>
        <div class="helper-text">Product category</div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <input
          type="text"
          id="description"
          name="description"
          placeholder="Brief description..."
        >
        <div class="helper-text">Optional product details</div>
      </div>
    </div>

    <!-- Image URL -->
    <div class="form-group form-row full">
      <label for="imageUrl">Image URL</label>
      <input
        type="url"
        id="imageUrl"
        name="imageUrl"
        placeholder="https://example.com/image.jpg"
      >
      <div class="helper-text">Link to product image (optional)</div>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button type="submit" class="btn-submit">
        💾 Create Product
      </button>
      <button type="button" class="btn-cancel" onclick="window.history.back()">
        ✕ Cancel
      </button>
    </div>
  </form>
</div>

<script src="/js/roleControl.js"></script>

<script>
let formInitialized = false;

// Setup page
async function setupPage() {
  console.log('[CreateProduct] setupPage() called');

  try {
    // Optional admin auth check
    if (typeof enforceAdminDashboard === 'function') {
      const user = await enforceAdminDashboard();

      console.log('[CreateProduct] Auth result:', user);

      if (!user) {
        console.log('[CreateProduct] Unauthorized');
        return;
      }
    }

    initForm();

  } catch (error) {
    console.error('[CreateProduct] Setup error:', error);
  }
}

// Initialize form
function initForm() {
  if (formInitialized) {
    console.log('[CreateProduct] Form already initialized');
    return;
  }

  console.log('[CreateProduct] initForm() called');

  const form = document.getElementById('productForm');
  const submitBtn = document.querySelector('.btn-submit');

  if (!form) {
    console.error('[CreateProduct] Form not found');
    return;
  }

  // Handle form submission
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    e.stopPropagation();
    console.log('[New Product] Form submit event triggered');
    await submitForm();
  });

  // Also handle button click as fallback
  if (submitBtn) {
    submitBtn.addEventListener('click', async function (e) {
      e.preventDefault();
      console.log('[New Product] Submit button clicked');
      await submitForm();
    });
  }

  formInitialized = true;
  console.log('[CreateProduct] Form initialized successfully');
}

// Show alert
function showAlert(message, type = 'info') {
  const alertBox = document.getElementById('alertBox');

  const icons = {
    success: '✓',
    error: '✕',
    info: 'ℹ'
  };

  alertBox.className = `alert show ${type}`;

  alertBox.innerHTML = `
    <span class="alert-icon">${icons[type]}</span>
    ${message}
  `;

  // Auto hide
  setTimeout(() => {
    alertBox.classList.remove('show');
  }, 4000);
}

// Submit form
async function submitForm() {
  console.log('[New Product] submitForm() called');

  const form = document.getElementById('productForm');
  const submitBtn = document.querySelector('.btn-submit');

  if (!form || !submitBtn) {
    console.error('[New Product] Missing form elements');
    showAlert('Form error: Missing form elements', 'error');
    return;
  }

  // Prevent double submit
  if (submitBtn.disabled) {
    console.log('[New Product] Already submitting, ignoring duplicate click');
    return;
  }

  // Check form validity
  console.log('[New Product] Checking form validity...');
  
  const isValid = form.checkValidity();
  console.log('[New Product] Form checkValidity result:', isValid);

  if (!isValid) {
    console.log('[New Product] Form validation failed - invalid fields detected');
    
    // Debug which fields are invalid
    const fields = form.querySelectorAll('input, select, textarea');
    fields.forEach(field => {
      const valid = field.checkValidity();
      if (!valid) {
        console.warn(`[Validation Error] Field "${field.id}" is invalid:`, field.validationMessage);
        field.style.borderColor = 'var(--rose)';
      } else {
        field.style.borderColor = '';
      }
    });

    showAlert('❌ Please fill in all required fields correctly', 'error');
    return;
  }

  console.log('[New Product] Form validation passed - all fields valid');

  // Collect form data
  const formData = {
    name: document.getElementById('productName').value.trim(),
    price: parseFloat(document.getElementById('price').value),
    stock: parseInt(document.getElementById('stock').value),
    category: document.getElementById('category').value,
    description: document.getElementById('description').value.trim(),
    image_url: document.getElementById('imageUrl').value.trim()
  };

  console.log('[New Product] Collected form data:', formData);

  try {
    // Set loading state
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    const originalText = submitBtn.innerHTML;
    submitBtn.innerHTML = '⏳ Creating Product...';

    console.log('[New Product] Sending POST request to API...');

    // Send to API
    const response = await fetch('/routes/api.php?action=products', {
      method: 'POST',
      credentials: 'include',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(formData)
    });

    console.log('[New Product] API Response status:', response.status);
    
    const result = await response.json();
    console.log('[New Product] API Response:', result);

    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    submitBtn.innerHTML = originalText;

    if (result.success) {
      const product = result.data || formData;
      console.log('[New Product] ✓ Product created successfully:', product);
      showAlert(`✓ Product "${product.name}" created successfully! Redirecting...`, 'success');
      
      setTimeout(() => {
        window.location.href = '/admin/inventory.html';
      }, 2000);
      
      form.reset();
    } else {
      const errorMsg = result.message || 'Failed to create product';
      console.error('[New Product] ✕ API error:', errorMsg);
      showAlert(`✕ ${errorMsg}`, 'error');
    }
    
  } catch (error) {
    console.error('[New Product] Exception during submission:', error);
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
    showAlert(`⚠ Network error: ${error.message}`, 'error');
  }
}

// Start app
document.addEventListener('DOMContentLoaded', () => {
  console.log('[CreateProduct] DOM Loaded');

  setupPage();
});
</script>

</body>
</html>
