<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - Milk App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --secondary: #3f37c9;
            --success: #4cc9f0;
            --danger: #e63946;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --text: #212529;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            background: #212529;
            color: white;
            padding: 20px;
            position: fixed;
        }

        .sidebar h2 { font-size: 1.5rem; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a { color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 8px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        .main-content { margin-left: 260px; flex: 1; padding: 30px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .btn { padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.3s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-danger { background: var(--danger); color: white; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .product-card:hover { transform: translateY(-5px); }

        .product-image {
            height: 180px;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #dee2e6;
            background-size: cover;
            background-position: center;
        }

        .product-info { padding: 20px; }
        .product-info h3 { margin: 0 0 10px; font-size: 1.1rem; }
        .product-info p { margin: 5px 0; color: #6c757d; font-size: 0.9rem; }
        .price { font-size: 1.2rem; font-weight: 700; color: var(--primary); }
        .stock { font-weight: 600; }
        .stock.low { color: var(--danger); }

        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .actions button { flex: 1; padding: 8px; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 500px;
            max-width: 90%;
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-glass-milk"></i> MilkApp</h2>
        <ul class="nav-links">
            <li><a href="/admin/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/admin/manage-product" class="active"><i class="fas fa-box"></i> Manage Products</a></li>
            <li><a href="/admin/inventory"><i class="fas fa-warehouse"></i> Inventory</a></li>
            <li><a href="/admin/delivery"><i class="fas fa-truck"></i> Deliveries</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Manage Products</h1>
            <button class="btn btn-primary" onclick="showAddModal()">
                <i class="fas fa-plus"></i> Add Product
            </button>
        </div>

        <div class="product-grid" id="productGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Product</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="category">
                        <option value="Milk">Milk</option>
                        <option value="Cheese">Cheese</option>
                        <option value="Yogurt">Yogurt</option>
                        <option value="Butter">Butter</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Price ($)</label>
                    <input type="number" id="price" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Initial Stock</label>
                    <input type="number" id="stock" value="0">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="image" placeholder="https://example.com/image.jpg">
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="btn btn-primary" style="flex:1">Save Product</button>
                    <button type="button" class="btn" style="background:#6c757d; color:white; flex:1" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let products = [];

        async function loadProducts() {
            try {
                const response = await fetch('/routes/api.php?action=products');
                const result = await response.json();
                if (result.success) {
                    products = result.data;
                    renderProducts();
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(p => {
                const img = p.image_url || '';
                return `
                <div class="product-card">
                    <div class="product-image" style="background-image: url('${img}'); background-size: cover; background-position: center;">
                        ${!img ? '<i class="fas fa-image" style="font-size: 3rem; color: #ddd;"></i>' : ''}
                    </div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.category}</p>
                        <div class="price">$${parseFloat(p.price).toFixed(2)}</div>
                        <div class="stock ${p.stock < 10 ? 'low' : ''}">Stock: ${p.stock}</div>
                        <div class="actions">
                            <button class="btn btn-success" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-danger" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function showAddModal() {
            document.getElementById('modalTitle').textContent = 'Add Product';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('productModal').style.display = 'none';
        }

        function editProduct(id) {
            const product = products.find(p => p.id == id);
            if (!product) return;

            document.getElementById('modalTitle').textContent = 'Edit Product';
            document.getElementById('productId').value = product.id;
            document.getElementById('name').value = product.name;
            document.getElementById('category').value = product.category;
            document.getElementById('price').value = product.price;
            document.getElementById('stock').value = product.stock;
            document.getElementById('description').value = product.description || '';
            document.getElementById('image').value = product.image_url || '';
            
            document.getElementById('productModal').style.display = 'flex';
        }

        async function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                const response = await fetch(`/routes/api.php?action=product&id=${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (result.success) {
                    loadProducts();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error deleting product:', error);
            }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('productId').value;
            const data = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: parseFloat(document.getElementById('price').value),
                stock: parseInt(document.getElementById('stock').value),
                description: document.getElementById('description').value,
                image: document.getElementById('image').value
            };

            const url = id ? `/routes/api.php?action=product&id=${id}` : '/routes/api.php?action=products';
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    closeModal();
                    loadProducts();
                } else {
                    alert(result.message);
                }
            } catch (error) {
                console.error('Error saving product:', error);
            }
        };

        window.onclick = (e) => {
            if (e.target == document.getElementById('productModal')) closeModal();
        };

        window.onload = loadProducts;
    </script>
</body>
</html>
