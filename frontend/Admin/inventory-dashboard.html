<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard - Milk App</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c3d2e;
            --accent: #c8832a;
            --accent-light: #fef3e2;
            --bg: #fdf6ec;
            --white: #ffffff;
            --text-main: #2b1d0e;
            --text-muted: #8d7a6a;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #e8d5c0;
            --shadow: 0 10px 30px rgba(92, 61, 46, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* NAVBAR */
        .navbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            border-bottom: 1.5px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-nav {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(200, 131, 42, 0.3);
        }

        .btn-primary:hover {
            background: #b8722a;
            transform: translateY(-2px);
        }

        /* MAIN CONTENT */
        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-accent {
            background: var(--accent);
            color: white;
        }

        .btn-accent:hover {
            background: #b8722a;
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #ddc4b0;
        }

        /* ALERTS SECTION */
        .alerts-section {
            margin-bottom: 2rem;
        }

        .alerts-header {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .alerts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .alert-card {
            background: var(--white);
            border-left: 4px solid var(--warning);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .alert-card.critical {
            border-left-color: var(--error);
        }

        .alert-card.safe {
            border-left-color: var(--success);
            display: none;
        }

        .alert-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .alert-content {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .alert-bar {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .alert-progress {
            height: 100%;
            background: var(--warning);
            transition: width 0.3s;
        }

        .alert-card.critical .alert-progress {
            background: var(--error);
        }

        /* INVENTORY TABLE */
        .inventory-section {
            background: var(--white);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .filter-controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-input,
        .filter-select {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-input:focus,
        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 131, 42, 0.1);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--accent-light);
        }

        th {
            padding: 12px 1rem;
            text-align: left;
            font-weight: 700;
            color: var(--primary);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px 1rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: rgba(200, 131, 42, 0.03);
        }

        .product-cell {
            font-weight: 600;
        }

        .stock-cell {
            text-align: center;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-align: center;
        }

        .status-available {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .status-low {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .status-critical {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .price-cell {
            color: var(--accent);
            font-weight: 700;
        }

        .actions-cell {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-edit {
            background: var(--accent);
            color: white;
        }

        .btn-edit:hover {
            background: #b8722a;
        }

        .btn-stock-in {
            background: var(--success);
            color: white;
        }

        .btn-stock-in:hover {
            background: #16a34a;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-main);
        }

        .form-input {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 131, 42, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-modal-primary {
            background: var(--accent);
            color: white;
        }

        .btn-modal-primary:hover {
            background: #b8722a;
        }

        .btn-modal-secondary {
            background: var(--border);
            color: var(--text-main);
        }

        .btn-modal-secondary:hover {
            background: #ddc4b0;
        }

        /* STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--white);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-actions {
                width: 100%;
            }

            .filter-controls {
                flex-direction: column;
            }

            .search-input,
            .filter-select {
                width: 100%;
            }

            .table-wrapper {
                font-size: 0.85rem;
            }

            th, td {
                padding: 8px 0.5rem;
            }

            .btn-small {
                padding: 4px 8px;
                font-size: 0.75rem;
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">Milk<span>App</span></div>
        <div class="nav-links">
            <a href="index.html" class="btn-nav">Dashboard</a>
            <a href="pos.html" class="btn-nav">POS System</a>
            <button id="logoutBtn" class="btn-nav btn-primary">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Inventory Dashboard</h1>
            <div class="header-actions">
                <button id="stockInBtn" class="btn btn-accent">Stock In</button>
                <button id="stockOutBtn" class="btn btn-secondary">Stock Out</button>
            </div>
        </div>

        <!-- Alerts -->
        <div id="alertContainer"></div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Products</div>
                <div class="stat-value" id="totalProducts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Low Stock Items</div>
                <div class="stat-value" id="lowStockCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Stock Value</div>
                <div class="stat-value" id="totalValue">$0</div>
            </div>
        </div>

        <!-- Stock Alerts -->
        <div class="alerts-section">
            <div class="alerts-header">Stock Alerts</div>
            <div id="alertsContainer" class="alerts-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <p>All items are in stock</p>
                </div>
            </div>
        </div>

        <!-- Inventory Table -->
        <div class="inventory-section">
            <div class="section-header">
                <h2 class="section-title">Current Inventory</h2>
                <div class="filter-controls">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Search products..."
                    >
                    <select id="categoryFilter" class="filter-select">
                        <option value="">All Categories</option>
                        <option value="Fresh">Fresh</option>
                        <option value="Almond">Almond</option>
                        <option value="Oat">Oat</option>
                    </select>
                    <select id="stockFilter" class="filter-select">
                        <option value="">All Stock Levels</option>
                        <option value="critical">Critical (0 items)</option>
                        <option value="low">Low Stock</option>
                        <option value="available">Available</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Current Stock</th>
                            <th>Min Level</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 2rem;">Loading inventory...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Stock In Modal -->
    <div id="stockInModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Add Stock (Stock IN)</div>
            <form id="stockInForm">
                <div class="form-group">
                    <label class="form-label">Product</label>
                    <select id="productSelect" class="form-input" required>
                        <option value="">Select a product...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="quantityInput" class="form-input" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Supplier (Optional)</label>
                    <select id="supplierSelect" class="form-input">
                        <option value="">Select supplier...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes (Optional)</label>
                    <textarea id="notesInput" class="form-input" rows="3" placeholder="Add any notes..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-modal btn-modal-primary">Add Stock</button>
                    <button type="button" id="closeStockInBtn" class="btn-modal btn-modal-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Stock Out Modal -->
    <div id="stockOutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Remove Stock (Stock OUT)</div>
            <form id="stockOutForm">
                <div class="form-group">
                    <label class="form-label">Product</label>
                    <select id="productSelectOut" class="form-input" required>
                        <option value="">Select a product...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quantity</label>
                    <input type="number" id="quantityInputOut" class="form-input" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Reason (Optional)</label>
                    <textarea id="reasonInputOut" class="form-input" rows="3" placeholder="Why is stock being removed?"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn-modal btn-modal-primary">Remove Stock</button>
                    <button type="button" id="closeStockOutBtn" class="btn-modal btn-modal-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/js/inventory.ts"></script>
</body>
</html>
