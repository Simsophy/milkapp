<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard - Milk App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --success: #4cc9f0;
            --warning: #ffb703;
            --danger: #e63946;
            --bg: #f0f2f5;
            --card-bg: #ffffff;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; height: 100vh; background: #212529; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { font-size: 1.5rem; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 10px; }
        .nav-links a { color: #adb5bd; text-decoration: none; display: flex; align-items: center; gap: 10px; padding: 12px 15px; border-radius: 8px; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }

        .main-content { margin-left: 260px; flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }

        .card { background: white; border-radius: 15px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f0f2f5; color: #6c757d; }
        td { padding: 15px 12px; border-bottom: 1px solid #f0f2f5; }

        .type-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }
        .type-IN { background: #d4edda; color: #155724; }
        .type-OUT { background: #f8d7da; color: #721c24; }

        .btn { padding: 8px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; }
        .btn-primary { background: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fas fa-glass-milk"></i> MilkApp</h2>
        <ul class="nav-links">
            <li><a href="/admin/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a></li>
            <li><a href="/admin/manage-product"><i class="fas fa-box"></i> Manage Products</a></li>
            <li><a href="/admin/inventory" class="active"><i class="fas fa-warehouse"></i> Inventory</a></li>
            <li><a href="/admin/delivery"><i class="fas fa-truck"></i> Deliveries</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Inventory Dashboard</h1>
            <button class="btn btn-primary" onclick="showAdjustModal()">
                <i class="fas fa-plus-minus"></i> Adjust Stock
            </button>
        </div>

        <div class="card">
            <h2>Current Stock Status</h2>
            <table id="stockTable">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Current Stock</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="stockBody">
                    <tr><td colspan="5" style="text-align:center">Loading stock...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Stock Movement History</h2>
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Product</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Notes</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr><td colspan="5" style="text-align:center">Loading history...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Stock Adjustment Modal -->
    <div id="adjustModal" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center;">
        <div style="background:white; padding:30px; border-radius:15px; width:400px;">
            <h2 id="modalTitle">Adjust Stock</h2>
            <form id="adjustForm">
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Product</label>
                    <select id="adjProduct" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" required></select>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Action Type</label>
                    <select id="adjType" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;">
                        <option value="IN">Stock IN (+)</option>
                        <option value="OUT">Stock OUT (-)</option>
                    </select>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Quantity</label>
                    <input type="number" id="adjQty" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" min="1" required>
                </div>
                <div style="margin-bottom:15px;">
                    <label style="display:block; margin-bottom:5px; font-weight:600;">Notes</label>
                    <textarea id="adjNotes" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;" rows="2" placeholder="e.g., Supplier delivery, Damaged goods"></textarea>
                </div>
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button type="submit" class="btn btn-primary" style="flex:1">Save Change</button>
                    <button type="button" class="btn" style="background:#6c757d; color:white; flex:1" onclick="closeAdjustModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allProducts = [];

        async function loadInventory() {
            try {
                // Load current stock
                const stockRes = await fetch('/routes/api.php?action=inventory');
                const stockData = await stockRes.json();
                if (stockData.success) {
                    allProducts = stockData.data;
                    renderStock(allProducts);
                    populateProductDropdown(allProducts);
                }

                // Load history (logs)
                const historyRes = await fetch('/routes/api.php?action=stock-logs');
                const historyData = await historyRes.json();
                if (historyData.success) {
                    renderHistory(historyData.data);
                }
            } catch (error) {
                console.error('Error loading inventory:', error);
            }
        }

        function populateProductDropdown(products) {
            const select = document.getElementById('adjProduct');
            select.innerHTML = products.map(p => `<option value="${p.id}">${p.name} (Current: ${p.stock})</option>`).join('');
        }

        function showAdjustModal() {
            document.getElementById('adjustModal').style.display = 'flex';
        }

        function closeAdjustModal() {
            document.getElementById('adjustModal').style.display = 'none';
        }

        document.getElementById('adjustForm').onsubmit = async (e) => {
            e.preventDefault();
            const productId = document.getElementById('adjProduct').value;
            const type = document.getElementById('adjType').value;
            const qty = document.getElementById('adjQty').value;
            const notes = document.getElementById('adjNotes').value;

            const action = type === 'IN' ? 'stock-in' : 'stock-out';

            try {
                const response = await fetch(`/routes/api.php?action=${action}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product_id: productId,
                        quantity: qty,
                        notes: notes
                    })
                });
                const result = await response.json();
                if (result.success) {
                    closeAdjustModal();
                    loadInventory();
                    alert('Stock adjusted successfully!');
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                console.error('Error adjusting stock:', error);
            }
        };

        function renderStock(products) {
            const body = document.getElementById('stockBody');
            body.innerHTML = products.map(p => `
                <tr>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.category}</td>
                    <td>$${parseFloat(p.price).toFixed(2)}</td>
                    <td>${p.stock}</td>
                    <td>
                        <span style="color: ${p.stock < 10 ? 'red' : 'green'}; font-weight: bold;">
                            ${p.stock < 10 ? 'Low Stock' : 'In Stock'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        function renderHistory(logs) {
            const body = document.getElementById('historyBody');
            body.innerHTML = logs.map(l => `
                <tr>
                    <td>${new Date(l.created_at).toLocaleString()}</td>
                    <td>${l.product_name}</td>
                    <td><span class="type-badge type-${l.type}">${l.type}</span></td>
                    <td>${l.quantity}</td>
                    <td>${l.notes || '-'}</td>
                </tr>
            `).join('');
        }

        window.onload = loadInventory;
    </script>
</body>
</html>
