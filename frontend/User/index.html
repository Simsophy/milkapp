<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milk App Premium Order</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
  --primary: #5c3d2e;
  --accent: #c8832a;
  --accent-light: #fef3e2;
  --bg: #fdf6ec;
  --white: #ffffff;
  --text-main: #2b1d0e;
  --text-muted: #8d7a6a;
  --sage: #7a9e7e;
  --border: #e8d5c0;
  --shadow: 0 10px 30px rgba(92, 61, 46, 0.08);
  --radius: 18px;
}

/* RESET */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text-main);
  line-height: 1.6;
}

/* NAVBAR */
.navbar {
  height: 72px;
  background: rgba(255, 255, 255, 0.8);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 2rem;
  border-bottom: 1.5px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.brand {
  font-size: 1.5rem;
  font-weight: 800;
  color: var(--primary);
}

.brand span {
  color: var(--accent);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.btn-nav {
  text-decoration: none;
  padding: 10px 18px;
  border-radius: 12px;
  font-weight: 600;
  border: none;
  cursor: pointer;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

/* LAYOUT */
.page-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 2rem;
  max-width: 1400px;
  margin: 2rem auto;
  padding: 0 2rem;
}

/* PRODUCTS */
.category-tabs {
  display: flex;
  gap: 0.75rem;
  overflow-x: auto;
  margin-bottom: 1.5rem;
}

.cat-tab {
  padding: 10px 18px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 50px;
  cursor: pointer;
  font-weight: 600;
  color: var(--text-muted);
}

.cat-tab.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 1.5rem;
}

.product-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1rem;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: 0.3s;
}

.product-card:hover {
  transform: translateY(-6px);
  box-shadow: var(--shadow);
  border-color: var(--accent);
}

.card-img {
  font-size: 3rem;
  text-align: center;
}

.card-name {
  font-weight: 700;
}

.card-footer-row {
  display: flex;
  justify-content: space-between;
  margin-top: 10px;
}

.card-price {
  color: var(--accent);
  font-weight: 800;
}

/* ORDER PANEL */
.order-panel {
  background: var(--white);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  height: calc(100vh - 120px);
  position: sticky;
  top: 100px;
  display: flex;
  flex-direction: column;
}

.panel-header {
  padding: 1.5rem;
  border-bottom: 1px solid var(--border);
}

.cart-items {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
}

.empty-cart {
  text-align: center;
  color: var(--text-muted);
  padding-top: 50px;
}

.order-summary {
  padding: 1rem;
}

.order-summary div {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

.total {
  font-weight: 800;
}

.btn-print {
  width: 100%;
  padding: 14px;
  background: var(--primary);
  color: white;
  border: none;
  font-weight: 800;
  cursor: pointer;
}

.lang-switch {
  display: flex;
  gap: 6px;
}

.lang-btn {
  padding: 6px 10px;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  border-radius: 6px;
}

.lang-btn.active {
  background: var(--accent);
  color: white;
}
</style>
</head>
<body>

<header class="navbar">
  <span class="brand">Milk <span>App</span></span>

  <nav class="nav-links">
    <a href="deleveryrc.html" class="btn-nav nav-link" data-i18n="navDelivery">Delivery</a>
    <button class="btn-nav btn-primary" data-i18n="navNewOrder">+ New Order</button>

    <div class="lang-switch">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="kh">KH</button>
    </div>
  </nav>
</header>

<div class="page-layout">

  <!-- PRODUCTS -->
  <section class="products-area">
    <div class="page-header">
      <h2 data-i18n="selectMilk">Select Fresh Milk</h2>
      <p data-i18n="selectSub">Build your order by selecting products below</p>
    </div>

    <div class="category-tabs" id="categoryTabs">
      <button class="cat-tab active" data-cat="all" data-i18n="catAll">🥛 All</button>
      <button class="cat-tab" data-cat="fresh" data-i18n="catFresh">🌿 Fresh</button>
      <button class="cat-tab" data-cat="flavored" data-i18n="catFlavored">🍫 Flavored</button>
      <button class="cat-tab" data-cat="yogurt" data-i18n="catYogurt">🫙 Yogurt</button>
      <button class="cat-tab" data-cat="cheese" data-i18n="catCheese">🧀 Cheese</button>
      <button class="cat-tab" data-cat="butter" data-i18n="catButter">🧈 Butter</button>
    </div>

    <div class="product-grid" id="productGrid"></div>
  </section>

  <!-- ORDER PANEL -->
  <aside class="order-panel">

    <div class="panel-header">
      <h3 data-i18n="receiptTitle">Official Receipt</h3>
      <small id="receiptDate" data-i18n="newOrder">New Order</small>
    </div>

    <div id="cartItems">
      <p class="empty-cart" data-i18n="cartEmpty">Cart is empty</p>
    </div>

    <div id="orderControls" class="order-controls">
      <div class="order-summary">
        <div><span data-i18n="subtotal">Subtotal</span><span id="subtotal">$0.00</span></div>
        <div><span data-i18n="tax">Tax (10%)</span><span id="taxAmt">$0.00</span></div>
        <div class="total"><span data-i18n="total">Total</span><span id="grandTotal">$0.00</span></div>
      </div>

      <button class="btn-print" onclick="handlePrint()" data-i18n="btnPrint">
        🖨️ PRINT RECEIPT
      </button>

      <p id="payStatus" class="pay-status"></p>
    </div>

  </aside>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
