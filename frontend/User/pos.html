<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS System - Milk App</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #5c3d2e;
            --accent: #c8832a;
            --accent-light: #fef3e2;
            --bg: #fdf6ec;
            --white: #ffffff;
            --text-main: #2b1d0e;
            --text-muted: #8d7a6a;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --border: #e8d5c0;
            --shadow: 0 10px 30px rgba(92, 61, 46, 0.08);
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* NAVBAR */
        .navbar {
            height: 72px;
            background: rgba(255, 255, 255, 0.8);
          
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            border-bottom: 1.5px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-nav {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(200, 131, 42, 0.3);
        }

        .btn-primary:hover {
            background: #b8722a;
            transform: translateY(-2px);
        }

        /* MAIN LAYOUT */
        .pos-layout {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 2rem;
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
            height: calc(100vh - 100px);
        }

        /* PRODUCTS SECTION */
        .products-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .search-box {
            flex: 1;
            max-width: 300px;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 131, 42, 0.1);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            text-align: center;
            transition: 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow);
            transform: translateY(-4px);
        }

        .product-image {
            width: 100%;
            height: 160px;
            background: var(--accent-light);
            border-radius: 12px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .product-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .product-stock {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }

        .stock-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .stock-available {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
        }

        .stock-low {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .stock-out {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
        }

        .btn-add {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover:not(:disabled) {
            background: #b8722a;
        }

        .btn-add:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* CART SIDEBAR */
        .cart-sidebar {
            background: var(--white);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            overflow-y: auto;
            height: 100%;
        }

        .cart-header {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .cart-items {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        .cart-item {
            background: var(--accent-light);
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
        }

        .cart-item-price {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .qty-input {
            width: 50px;
            padding: 6px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
        }

        .btn-remove {
            padding: 6px 10px;
            background: var(--error);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .cart-empty {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        /* CART SUMMARY */
        .cart-summary {
            border-top: 2px solid var(--border);
            padding-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: var(--text-main);
        }

        .summary-total {
            font-size: 1.3rem;
            color: var(--accent);
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-checkout:hover:not(:disabled) {
            background: #b8722a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(200, 131, 42, 0.3);
        }

        .btn-checkout:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-clear-cart {
            width: 100%;
            padding: 8px;
            background: transparent;
            color: var(--error);
            border: 1.5px solid var(--error);
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-clear-cart:hover {
            background: rgba(239, 68, 68, 0.05);
        }

        /* ALERT */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid var(--error);
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            color: var(--text-main);
        }

        .form-input {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200, 131, 42, 0.1);
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-modal-primary {
            background: var(--accent);
            color: white;
        }

        .btn-modal-primary:hover {
            background: #b8722a;
        }

        .btn-modal-secondary {
            background: var(--border);
            color: var(--text-main);
        }

        .btn-modal-secondary:hover {
            background: #ddc4b0;
        }

        /* RESPONSIVE */
        @media (max-width: 1024px) {
            .pos-layout {
                grid-template-columns: 1fr;
                height: auto;
            }

            .cart-sidebar {
                height: auto;
            }

            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            }
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">Milk<span>App</span></div>
        <div class="nav-links">
            <a href="/" class="btn-nav">Dashboard</a>
            <a href="/admin/inventory" class="btn-nav admin-only">Inventory</a>
            <button id="logoutBtn" class="btn-nav btn-primary">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="pos-layout">
        <!-- Products Section -->
        <div class="products-section">
            <div class="section-header">
                <h1 class="section-title">Products</h1>
                <input type="text" id="searchBox" class="search-box" placeholder="Search products...">
            </div>
            <div id="productsContainer" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </div>

        <!-- Cart Sidebar -->
        <div class="cart-sidebar">
            <div class="cart-header">Shopping Cart</div>
            <div id="alertContainer"></div>
            <div id="cartItemsContainer" class="cart-items">
                <div class="cart-empty">Your cart is empty</div>
            </div>

            <!-- Cart Summary -->
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total:</span>
                    <span id="totalAmount">$0.00</span>
                </div>
            </div>

            <!-- Checkout Button -->
            <button id="checkoutBtn" class="btn-checkout" disabled>Proceed to Checkout</button>
            <button id="clearCartBtn" class="btn-clear-cart">Clear Cart</button>
        </div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Confirm Order</div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Order Summary</label>
                    <div id="orderSummary" style="background: var(--accent-light); padding: 1rem; border-radius: 10px; max-height: 200px; overflow-y: auto;"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Order Notes (Optional)</label>
                    <textarea id="orderNotes" class="form-input" rows="3" placeholder="Add any special notes..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Total Amount</label>
                    <input type="text" id="orderTotal" class="form-input" readonly>
                </div>
            </div>
            <div class="modal-footer">
                <button id="confirmOrderBtn" class="btn-modal btn-modal-primary">Confirm & Pay</button>
                <button id="cancelOrderBtn" class="btn-modal btn-modal-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script type="module" src="/js/pos.js"></script>
</body>
</html>
